# Server Configuration
server.port=8080

# Application Name
spring.application.name=LCA

# Database Configuration (H2 in-memory for development)
spring.datasource.url=jdbc:h2:mem:lcadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mail Configuration - Direct Gmail SMTP
mail.username=animeshclouds@gmail.com
mail.password=utxu mqcw rlbi kvce

# Disable Spring Mail auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Logging
logging.level.org.springframework.mail=DEBUG
logging.level.com.LCA.cat=INFO
logging.level.org.hibernate.SQL=DEBUG
