# Production Configuration for Render Deployment

# Server Configuration
server.port=${PORT:8080}

# Application Name
spring.application.name=LCA

# Database Configuration (H2 file-based for persistence)
spring.datasource.url=jdbc:h2:file:/app/data/lcadb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (disable in production for security)
spring.h2.console.enabled=false

# Mail Configuration - Using Resend API (HTTP-based, no SMTP needed)
resend.api.key=${RESEND_API_KEY:re_dummy}
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# Disable Spring Mail auto-configuration (using Resend HTTP API instead)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.LCA.cat=INFO

# CORS Configuration
cors.allowed.origins=${ALLOWED_ORIGINS:http://localhost:3000}
