# Production Configuration for Render Deployment

# Server Configuration
server.port=${PORT:8080}

# Application Name
spring.application.name=LCA

# Database Configuration (H2 file-based for persistence)
spring.datasource.url=jdbc:h2:file:/app/data/lcadb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (disable in production for security)
spring.h2.console.enabled=false

# Mail Configuration (uses environment variables with defaults)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:dummy@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dummy-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=false
management.health.defaults.enabled=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Logging Configuration
logging.level.root=INFO
logging.level.com.LCA.cat=INFO

# CORS Configuration
cors.allowed.origins=${ALLOWED_ORIGINS:http://localhost:3000}
