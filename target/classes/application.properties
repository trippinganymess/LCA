# Server Configuration
server.port=8080

# Application Name
spring.application.name=LCA

# Database Configuration (H2 in-memory for development)
spring.datasource.url=jdbc:h2:mem:lcadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mail Configuration
# IMPORTANT: Replace these with your actual email credentials
# For Gmail, you need to:
# 1. Enable 2-factor authentication
# 2. Generate an "App Password" from Google Account settings
# 3. Use the app password instead of your regular password

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=animeshclouds@gmail.com
spring.mail.password=utxu mqcw rlbi kvce
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Logging
logging.level.org.springframework.mail=DEBUG
logging.level.com.LCA.cat=INFO
logging.level.org.hibernate.SQL=DEBUG
